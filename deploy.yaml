name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - develop

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  IMAGE_NAME: ponti-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Autenticación con la llave JSON (Aquí seguramente falló antes)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. Configurar Docker
      - name: Configure Docker
        run: gcloud auth configure-docker

      # 3. Construir y subir imagen
      - name: Build and Push Docker Image
        run: |
          docker build -t gcr.io/$PROJECT_ID/$IMAGE_NAME:${{ github.sha }} .
          docker push gcr.io/$PROJECT_ID/$IMAGE_NAME:${{ github.sha }}

      # 4. Despliegue a DEV (Solo rama develop)
      - name: Deploy to DEV
        if: github.ref == 'refs/heads/develop'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ponti-api-dev
          image: gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          env_vars: NODE_ENV=development

      # 5. Despliegue a PROD (Solo rama main)
      - name: Deploy to PROD
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ponti-api-prod
          image: gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          env_vars: NODE_ENV=production