name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - develop

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  # CAMBIO 1: Usamos la dirección moderna de Artifact Registry
  # Estructura: REGION-docker.pkg.dev/PROJECT_ID/REPO_NAME/IMAGE_NAME
  IMAGE_URL: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ponti-repo/ponti-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Autenticación
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. Configurar Docker para la NUEVA dirección
      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      # 3. Construir y subir imagen (Usando la nueva URL)
      - name: Build and Push Docker Image
        run: |
          docker build -t $IMAGE_URL:${{ github.sha }} .
          docker push $IMAGE_URL:${{ github.sha }}

      # 4. Despliegue a DEV
      - name: Deploy to DEV
        if: github.ref == 'refs/heads/develop'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ponti-api-dev
          image: ${{ env.IMAGE_URL }}:${{ github.sha }}
          region: ${{ env.REGION }}
          env_vars: NODE_ENV=development

      # 5. Despliegue a PROD
      - name: Deploy to PROD
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ponti-api-prod
          image: ${{ env.IMAGE_URL }}:${{ github.sha }}
          region: ${{ env.REGION }}
          env_vars: NODE_ENV=production